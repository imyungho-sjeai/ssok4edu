<script>
window.DODAM_PORTRAIT_SEED={"books":[{"id":"2144","title":"기후위기는 어떻게 내 몸을 병들게 하는가","author":"크리스티나 베른트 지음 ｜ 추미란 옮김","publisher":"동녘","description":"기후위기는 더 이상 북극의 얼음이 녹는 먼 미래의 환경 문제가 아니라, 지금 이 순간 내 몸에 영향을 미치는 문제이다. 폭염이 길어지고 미세먼지와 대기오염이 심해질 때 우리의 몸에는 어떤 변화가 나타날까?\n\n과학저널리스트 크리스티나 베른트는 기후변화와 인간의 건강이 어떻게 연결되어 있는지를 다양한 과학적 연구와 사례를 통해 살펴본다. 폭염과 열대야는 심혈관·호흡기 질환을 악화시키고, 대기오염은 신경계와 여러 장기에 영향을 미치며, 곤충의 감소와 생태계 변화는 우리가 먹는 음식과 건강에도 영향을 준다. 그뿐이 아니다. 재난과 미래에 대한 불안, 죄책감 같은 기후불안 역시 우리 정신건강을 위협하는 엄연한 증상이다. 하지만 저자는 문제의 심각성을 지적하는 데서 그치지 않는다. 자연과 인간에게는 기후회복력이 있으니 이를 신뢰하고 실천하자고 촉구한다.\n\n이 책은 기후위기를 거대한 사회적·환경적 문제로만 인식했던 우리에게 나와 가족의 건강이라는 가까운 관점에서 문제를 바라보게 한다. 건강과 미래의 삶을 고민하는 이들에게 권한다. 개인의 생활 방식과 사회의 대응이 왜 함께 변화해야 하는지 생각해 보게 될 것이다.","image":"portrait-did-images/1c3106d9b1e0ea4896f9fcb3.jpg","url":"https://www.mcst.go.kr/site/s_culture/book/bookView.jsp?pDetailSeq=2144","kind":"books"},{"id":"2143","title":"최소한의 양자역학","author":"프랭크 베르스트라테, 셀린 브뢰카에르트 지음 ｜ 최진영 옮김","publisher":"동아엠앤비","description":"불확실성으로 가득한 세상. 그 근원에는 눈에 보이지 않는 양자의 세계가 자리하고 있다. 이 작은 입자들이 우리의 일상을 지배한다는 사실을 알게 된다면, 세상을 보는 시각은 달라질 것이다.\n\n이 책은 물리학자와 언어학자가 공동 집필한 과학교양서로, 양자역학을 신비한 영역이 아닌 문학이나 예술처럼 현대 문화를 이해하는 필수 지식으로 소개한다. 16세기부터 오늘날 양자컴퓨터 시대에 이르는 500여 년의 물리학 역사를 따라가며, 양자역학의 핵심 개념인 중첩, 불확정성, 얽힘 등을 과학과 인문학의 시각에서 함께 풀어낸다. 이를 통해 원자 세계의 질서뿐 아니라 양자컴퓨터와 양자암호화 등 최신 기술의 원리까지 이해하도록 돕는다. 나아가 양자역학적 사고가 우리의 세계관과 삶의 지평을 어떻게 넓히는지도 설득력 있게 보여준다.\n\n양자역학을 실용적으로 익히고 싶은 입문자부터 양자 시대에 필요한 판단력과 통찰을 얻고 싶은 독자까지 폭넓게 읽어볼 만한 책이다. 세상을 새로운 관점으로 바라보고 싶은 이들에게 추천한다.","image":"portrait-did-images/33c0b5f3423974c13026c270.jpg","url":"https://www.mcst.go.kr/site/s_culture/book/bookView.jsp?pDetailSeq=2143","kind":"books"},{"id":"2142","title":"욕망의 음식: 역사와 문화에 깃든 탐식의 인류학","author":"연호탁 지음","publisher":"글항아리","description":"맛있는 한 끼 앞에서 무너지는 다이어트의 다짐. 식탐 앞에서 무력해지는 순간. 낯설지 않은 풍경이다. 먹방 열풍이 불러온 질문, 인간은 왜 배가 불러도 계속 먹고 싶어 할까. 이 오래된 질문을 탐구하는 책이 나왔다.\n\n언어학과 역사학을 넘나들어 온 저자는, 음식에 대한 인간의 열망을 ‘탐식’이라는 렌즈로 새롭게 조명한다. 저자는 언어학자로서 단어의 어원을 짚고, 역사학자로서 음식과 함께 이동한 문명의 흔적을 따라가며, 여행가로서 직접 경험한 현지 문화를 보태, 음식에 깃든 욕망의 역사를 풀어낸다. 40여 년간 채식을 이어온 저자는 욕망을 절제해 온 덕분에 오히려 그 본질을 더욱 예리하게 들여다본다. 중국의 전족 문화가 일종의 주먹밥인 쭝쯔와 어떤 관련이 있는지, 금식을 강조하는 서구에서 생선 요리가 발달한 이유는 무엇인지, 로시니와 다빈치는 왜 그토록 미식에 탐닉했는지, 책 속 다양한 사례는 음식이 단순한 생존 수단을 넘어 문화와 욕망의 기록임을 보여준다.\n\n매일 마주하는 식탁의 의미를 다시 생각해 보고 싶은 독자에게 이 책을 권한다. 식탁에서 식욕과 문화, 인간 욕망의 관계를 새롭게 발견하게 될 것이다.","image":"portrait-did-images/52b1c309df1f7087d608a345.jpg","url":"https://www.mcst.go.kr/site/s_culture/book/bookView.jsp?pDetailSeq=2142","kind":"books"},{"id":"2141","title":"호모 딜리버리쿠스","author":"김철민","publisher":"Holidaybooks(홀리데이북스)","description":"손가락 클릭 몇 번이면 언제든 필요한 물건을 집 앞에서 받아볼 수 있는 시대. 일상화된 배송의 편리함은 우리의 삶을 어떻게 바꾸었을까? 그리고 그 편리함 속에서 우리가 놓치고 있는 것은 무엇일까?\n\n책 제목이 말하듯 우리는 ‘배송받는 인간(호모 딜리버리쿠스)’이 되었다. 코로나19 이후, 배송이 일상의 필수 인프라로 자리 잡으면서 우리의 시간 감각과 소비 방식, 도시 공간, 플랫폼 노동과 심리적 측면까지 배송의 영향을 받지 않은 것이 없다. 이 책은 26년간 유통·물류 현장을 지켜본 저자가 배송 문명이 인간의 삶을 어떻게 변화시켰는지를 살펴보는 사회비평서이다. 우리가 편리함과 효율이라는 이름 아래 시간 주도권, 우연한 만남의 기회, 노동 주권, 주체성까지도 잃어가고 있음을 예리하게 짚어내며, 익숙함에 가려진 변화의 양면을 함께 응시하게 한다.\n\n배송을 단순한 산업이나 서비스가 아닌 하나의 문명적 변화로 해석한다는 점에서 이 책은 특별하다. 물류와 플랫폼 경제가 우리의 삶을 어떻게 바꾸는지 궁금한 독자, 익숙한 일상 속에 숨은 사회적 변화를 새롭게 바라보고 싶은 독자에게 권한다.","image":"portrait-did-images/17276b05fcd5ac2a826628b4.jpg","url":"https://www.mcst.go.kr/site/s_culture/book/bookView.jsp?pDetailSeq=2141","kind":"books"},{"id":"2140","title":"시간을 읽는 그림","author":"김선지","publisher":"블랙피쉬","description":"사형수의 시신을 앞에 두고 진행되는 해부학 강의, 흑사병을 신의 징벌로 여기고 스스로를 채찍질하는 사람들, 포위된 도시에서 쥐고기를 팔아야 했던 파리 시민들. 낯설고도 충격적인 이 장면들은 한 점의 그림 속에 남아 오늘날까지 전해진다.\n\n『시간을 읽는 그림』은 연표와 사건을 나열하는 대신, 그림 한 점에서 출발해 세계사를 읽어나가는 책이다. 고대 문명부터 현대 사회에 이르기까지, 렘브란트의 \u003c니콜라스 튈프 박사의 해부학 강의\u003e와 같은 명화는 물론, 삽화와 판화, 포스터 등 다양한 시각 자료를 통해 프랑스 혁명의 격동, 흑사병·아일랜드 대기근 같은 재난, 과학혁명과 산업화가 가져온 변화를 따라간다. 거대한 역사적 사건과 그 시대를 살아간 보통 사람들의 일상과 감정까지 함께 살펴본다는 점에서 이 책은 ‘새의 눈’으로 보는 세계사이자 ‘곤충의 눈’으로 보는 생활사이기도 하다.\n\n이 책은 그림을 그저 감상의 대상이 아니라 시대의 문서로 다룬다는 점에서 특별하다. 한 점의 그림 속에 남겨진 시대의 풍경을 통해, 우리가 알지 못했던 역사의 한 장면을 새롭게 만나보는 것은 어떨까?","image":"portrait-did-images/5df1738df0327cec09c496b6.jpg","url":"https://www.mcst.go.kr/site/s_culture/book/bookView.jsp?pDetailSeq=2140","kind":"books"},{"id":"2139","title":"마음은 아직 수습입니다","author":"박혜연 지음","publisher":"휴머니스트출판그룹","description":"번아웃이나 무기력증이 엄습해 올 때, 누구나 한 번쯤은 ‘내 노력이 부족해서 혹은 능력이 부족해서 그런 건 아닐까?’ 의심하게 된다. 하지만 당신에게 필요한 것은 더 강한 의지가 아니라, 지친 마음과 일상을 다시 ‘수습’할 시간일지도 모른다.\n\n이 책은 마음의 문제로 고민하는 대학생들의 질문에 답하고자 개설한 강의 내용을 정리한 정신건강 교양서이다. 저자는 번아웃과 무기력 앞에서 자책해 온 이들에게 정신과 방문법에서부터 심리상담 전문가를 찾는 법, 그리고 약물치료에 대한 오해 바로잡기 등 구체적인 정보를 전한다. 이 책은 심리적 고통을 개인의 결함이 아니라 사회와 조직의 환경에서 이해해야 할 문제로 바라본다. 나아가 ‘외상후성장’이라는 개념을 설명하며, 상처받은 마음이 회복을 넘어 함께 살아가는 힘으로 자라날 가능성을 보여준다. 이러한 관점은 우리가 마음의 어려움을 대하는 방식을 되돌아보게 하며, 회복을 위해 무엇이 필요한지 생각하게 한다.\n\n심리적 고통을 이해하고 실질적인 해결 방안을 찾고 싶은 사람뿐만 아니라, 불안과 스트레스 속에서도 일상을 건강하게 유지하고 싶은 모든 이에게 추천한다. 자신의 마음을 돌보는 일이 곧 삶을 돌보는 일임을 깨닫고, 어떻게 살아갈 것인지 돌아보는 계기가 될 것이다.","image":"portrait-did-images/3d0bfb1e34a34dc28e410f81.jpg","url":"https://www.mcst.go.kr/site/s_culture/book/bookView.jsp?pDetailSeq=2139","kind":"books"},{"id":"2138","title":"애니가 남긴 것","author":"애너 퀸들런 지음 ｜ 김지현 옮김","publisher":"리프","description":"누구나 언젠가는 사랑하는 사람을 잃는다. 그러나 상실 그 이후의 삶에 대해 우리는 얼마나 알고 있을까. 소설 『애니가 남긴 것』 은 바로 그 상실 이후의 삶을 이야기한다.\n\n평범한 삶을 살던 애니가 저녁 식사를 준비하다 갑작스럽게 세상을 떠난 뒤, 남겨진 가족과 친구들은 소중한 이의 죽음 앞에서 각기 다른 방식으로 무너져 간다. 이 소설은 그들이 애니 없이 살아가야 하는 시간을 계절의 흐름에 따라 섬세하게 그려낸다. 시린 겨울 같던 상실의 순간이 봄, 여름, 가을을 지나며 서서히 아물어가는 과정에서, 인물들은 섣부른 위로 대신 슬픔의 민낯을 응시하며 현실적인 애도의 시간을 건넌다. 첫 페이지에 잠깐 등장하고 사라지지만 모두의 기억 속에 마지막까지 생생히 살아있는 주인공을 통해 평범한 일상과 곁에 있는 사람들의 소중함을 깨닫게 된다.\n\n가까운 이의 죽음이나 이별을 경험한 이들, 또는 가족의 의미와 삶의 유한함을 사색하고 싶은 이들이라면 누구나 이 이야기에서 깊은 공감과 위로를 얻을 수 있을 것이다. 애니가 남긴 것은 우리 모두가 좀 더 용감하게 자기 앞에 주어진 삶으로 나아갈 힘을 줄테니까.","image":"portrait-did-images/b1e6d95edc22b164c68b4cbb.jpg","url":"https://www.mcst.go.kr/site/s_culture/book/bookView.jsp?pDetailSeq=2138","kind":"books"},{"id":"2137","title":"삼문동 봉주르 아파트","author":"오서","publisher":"자음과모음","description":"우리나라 가구의 절반 이상이 아파트에 산다지만, 정작 옆집에 누가 사는지도 모르는 시대. 아파트라는 공간은 우리를 어떤 이웃으로 만들고 있을까?\n\n소설 『삼문동 봉주르 아파트』는 회사에서 해고된 후 얼떨결에 입주자대표회의(입대위) 대표를 맡게 된 주인공 ‘공정한’이, 동대표들과 이웃들의 뜻을 모아 아파트의 문화를 변화시켜 가는 이야기이다. 한국에서 가장 일상적인 공간인 아파트를 배경으로 이 소설에서 그려지는 갈등은 낯설지 않다. 아파트 관리 비리, 집단 이기주의, 주민들의 무관심, 경비원에 대한 부당한 처우까지, 뉴스에 심심치 않게 등장하는 우리 사회 공동체의 갈등을 적나라하게 드러내면서도 이를 풀어가는 과정만큼은 따뜻하게 그려내고 있다.\n\n이 책을 통해 매일 마주치면서도 무심했던 콘크리트 벽 너머 이웃들의 삶을 들여다보면 어떨까? 엘리베이터에서 마주치는 이웃의 얼굴이, 경비실의 풍경이 조금 더 다정하게 다가올지도 모른다. 희미해진 공동체의 의미를 다시 한번 되짚어보고 싶은 사람들에게 권한다.","image":"portrait-did-images/c282a5e95dd5f6433fee596e.jpg","url":"https://www.mcst.go.kr/site/s_culture/book/bookView.jsp?pDetailSeq=2137","kind":"books"}],"booksUpdatedAt":"2026-11-12T20:46:32.5045205Z","savedAt":1794516397339,"exhibitions":[{"cultureId":"402196","category":"음악/콘서트","organizer":"","contact":"02-523-6258","title":"[세종] 국립심포니콘서트오케스트라 \u003c드보르자크, 교향곡 9번 \u0027신세계로부터\u0027\u003e","poster":"https://www.culture.go.kr/upload/ucms/myRlyPerfInfo/2026/202610/d003e3cc55c94f73878584cc287427e2.png","source":"https://www.knso.or.kr/front/M0000028/performance/detail.do?performSn=PF002042\u0026pageIndex=1","dates":"2026-11-14 ~ 2026-11-14","region":"세종","price":"R석 2만원 / S석 1만원","targets":[],"endsOn":"2026-11-14","venue":"세종 | 세종예술의전당","address":"세종특별자치시 국립박물관로 21 세종예술의전당","eventTime":"오후 5:00","duration":"1시간 40분","shortIntroduction":"세종에서 열리는 음악 공연입니다.","image":"portrait-did-images/4392790bae5f44e5d2746a0f.jpg","kind":"exhibitions","url":"https://www.knso.or.kr/front/M0000028/performance/detail.do?performSn=PF002042\u0026pageIndex=1"},{"cultureId":"402173","category":"음악/콘서트","organizer":"","contact":"044-850-8989","title":"레 벙 프랑세 내한공연","poster":"https://www.culture.go.kr/upload/ucms/rlyPerfInfo/2026/202610/95b7d45cb11b449b9644129833cd4490.jpg","source":"https://www.sjac.or.kr/base/nrr/performance/read?performanceNo=657\u0026menuLevel=2\u0026menuNo=76","dates":"2026-11-17 ~ 2026-11-17","region":"세종","price":"R석 7만원 / S석 5만원","targets":[],"endsOn":"2026-11-17","venue":"세종 | 세종예술의전당","address":"세종특별자치시 국립박물관로 21 세종예술의전당","eventTime":"화요일 19:30","duration":"120분","shortIntroduc
