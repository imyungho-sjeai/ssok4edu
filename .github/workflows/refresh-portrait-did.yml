name: Refresh portrait DID content
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: dodam-did-data
  cancel-in-progress: false
jobs:
  content:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Refresh posters and books
        continue-on-error: true
        shell: pwsh
        run: ./dodam-clock-package/update-portrait-did.ps1
      - name: Save content
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dodam-clock-package/dodam-clock-discover.html dodam-clock-package/portrait-did-data.json dodam-clock-package/portrait-did-feed.js dodam-clock-package/portrait-did-images
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh portrait DID posters and books'
            git push
          fi
      - name: Rebuild branch-based Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
