<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>세종 학생 체육 대회 스코어 보드</title>
<style>
:root{--bg:#090d17;--p:#111a2e;--p2:#1b2845;--tx:#eef2fb;--mu:#8e9bbb;--ac:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;border-radius:10px;background:var(--p2);padding:10px 12px;cursor:pointer;font-weight:700}
button:hover{filter:brightness(1.3)}button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
small{opacity:.6;font-weight:500;margin-left:4px}
input{font:inherit;color:inherit;background:#0a1020;border:1px solid #2a3858;border-radius:8px;padding:8px 10px;width:100%;min-width:0}
label{font-size:12px;color:var(--mu);display:block}
#app{display:grid;grid-template-columns:400px 1fr;height:100%}
#ctl{background:var(--p);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
#view{display:flex;align-items:center;justify-content:center;padding:16px;min-width:0}
body.out #app{grid-template-columns:1fr}body.out #ctl{display:none}body.out #view{padding:0}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.blk{background:#0d1526;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.nr{display:flex;gap:8px;align-items:center}.sws{display:flex;gap:4px;flex-wrap:wrap;width:104px}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}.sw.on{border-color:#fff}
#pad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:#0d1526;border-radius:12px;padding:10px;text-align:center}
.pn{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:60px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.pb{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.pb button{font-size:22px;padding:14px 0}.pb .neg{background:#3a2230}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ct{font-size:38px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;color:var(--ac)}.ct.s{font-size:20px;color:var(--tx)}
.fb{display:flex;align-items:center;gap:6px;font-size:13px}.fb b{font-size:20px}
.outb{background:linear-gradient(#ffd23f,#ffb000);color:#241a00;font-size:20px;padding:16px}
details{font-size:12px;color:var(--mu);line-height:1.7}summary{cursor:pointer}
#toast{position:fixed;left:50%;top:18px;translate:-50% 0;background:#000d;padding:10px 18px;border-radius:99px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
#setup{position:fixed;inset:0;background:radial-gradient(100% 80% at 50% 0,#17233f,#090d17);z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--p);border-radius:20px;padding:28px;width:min(600px,100%);max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.card h1{font-size:26px}.mu{color:var(--mu);font-size:14px}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gr button{font-size:14px;padding:10px 2px;border:2px solid transparent}.gr button span{display:block;font-size:24px;margin-bottom:2px}
.on{border-color:var(--ac)!important;background:#2a3a63}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.seg button{border:2px solid transparent;font-size:17px}#ctl .seg button{font-size:13px;padding:10px 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.go{background:var(--ac);color:#241a00;font-size:20px;padding:16px}
#hint{display:none}body.bo #hint{display:block;position:fixed;bottom:3vh;left:50%;translate:-50% 0;background:#000b;padding:10px 20px;border-radius:99px;font-size:16px;z-index:5}
/* 전광판 */
.stage{container-type:size;width:min(100%,calc((100vh - 32px)*16/9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#05070d;box-shadow:0 10px 40px #0008}
body.out .stage{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}
.board{--u:min(1cqh,.5625cqw);height:100cqh;display:flex;flex-direction:column;gap:calc(var(--u)*1.5);padding:calc(var(--u)*2);background:radial-gradient(120% 100% at 50% 0,#16213d,#05070d 70%);font-size:calc(var(--u)*4)}
.board *{line-height:1}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:calc(var(--u)*17);flex:none}
.top .l,.top .r{font-size:calc(var(--u)*6.5);font-weight:800;color:#cfd8ee}.top .r{text-align:right;color:var(--ac)}
.m{text-align:center}
.clk{font-size:calc(var(--u)*13);font-weight:900;font-variant-numeric:tabular-nums;color:var(--ac);text-shadow:0 0 calc(var(--u)*3) #ffd23f55;padding:0 calc(var(--u)*4)}.clk.off{color:#ff9f43}
.per{display:inline-block;margin-top:calc(var(--u)*1);font-size:calc(var(--u)*4.6);font-weight:800;background:#ffffff1a;border-radius:99px;padding:calc(var(--u)*1) calc(var(--u)*3)}
.main{position:relative;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2);min-height:0}
.tm{position:relative;min-height:0;overflow:hidden;border-radius:calc(var(--u)*3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.5);padding-top:calc(var(--u)*7);background:linear-gradient(165deg,color-mix(in srgb,var(--c) 90%,#000),color-mix(in srgb,var(--c) 38%,#000))}
.nm{font-weight:800;max-width:94%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 8px #0006;padding:.1em 0}
.ht .sc{font-size:calc(var(--u)*34)}.ht .sc.s3{font-size:calc(var(--u)*27)}.sc{font-size:calc(var(--u)*40);font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 .6cqh 2cqh #0007}.sc.s3{font-size:calc(var(--u)*31)}
.sc.sw{font-size:calc(var(--u)*24)}.ttl{flex:none;text-align:center;font-size:calc(var(--u)*5.4);font-weight:800;color:#cfd8ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.15em 0}
.sb{font-size:calc(var(--u)*4.5);font-weight:700;opacity:.92;min-height:calc(var(--u)*5)}.sb b{font-size:calc(var(--u)*6)}
.lose{filter:saturate(.25) brightness(.55)}
.win{box-shadow:inset 0 0 0 calc(var(--u)*.9) var(--ac),0 0 calc(var(--u)*8) #ffd23f88}
.winb{position:absolute;top:calc(var(--u)*1.8);left:50%;translate:-50% 0;font-size:calc(var(--u)*6.5);font-weight:900;letter-spacing:.3em;padding:calc(var(--u)*1.2) calc(var(--u)*3) calc(var(--u)*1.2) calc(var(--u)*4);border-radius:99px;color:#241a00;background:linear-gradient(#ffe27a,#ffb800);animation:pu 1s ease-in-out infinite alternate}
@keyframes pu{to{scale:1.1}}@media(prefers-reduced-motion:reduce){.winb{animation:none}}
.draw{position:absolute;left:50%;top:50%;translate:-50% -50%;font-size:calc(var(--u)*9);font-weight:900;letter-spacing:.2em;background:#000c;color:var(--ac);padding:calc(var(--u)*2) calc(var(--u)*5);border-radius:calc(var(--u)*2)}
.foot{flex:none;display:flex;justify-content:center;align-items:center;gap:calc(var(--u)*4);flex-wrap:wrap;font-size:calc(var(--u)*4.6);font-weight:700;color:#cfd8ee;padding-bottom:calc(var(--u)*.5)}
.chip{background:#ffffff14;border-radius:99px;padding:calc(var(--u)*1.4) calc(var(--u)*3)}.chip b{color:var(--ac)}
.bso{display:flex;align-items:center;gap:calc(var(--u)*1.2)}.bso i{font-style:normal;font-weight:900;width:calc(var(--u)*4)}
.bso u{width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);border-radius:50%;background:#ffffff24}
.d0.on{background:#2ee67a}.d1.on{background:#ffd23f}.d2.on{background:#ff4d4d}

.s2{background:radial-gradient(110% 90% at 50% -10%,#1a2036,#07080d 62%)}
.s2 .ttl{color:#d8c28a;font-weight:600;letter-spacing:.14em}
.s2 .top .l,.s2 .top .r{color:#cdb77f;font-weight:600;letter-spacing:.08em}.s2 .top .r{color:#cdb77f}
.s2 .clk{color:#f6e7b8;font-weight:800;border:calc(var(--u)*.3) solid #cdb77f88;border-radius:calc(var(--u)*2);background:linear-gradient(#ffffff10,#00000040);text-shadow:0 0 calc(var(--u)*3) #e8c96a66;padding:calc(var(--u)*1) calc(var(--u)*5)}.s2 .clk.off{color:#e9b779}
.s2 .per{background:transparent;border:calc(var(--u)*.3) solid #cdb77f77;color:#ecdcae;font-weight:600;letter-spacing:.1em}
.s2 .tm{border:calc(var(--u)*.3) solid #cdb77f55;background:radial-gradient(90% 55% at 50% 112%,color-mix(in srgb,var(--c) 48%,transparent),transparent 70%),linear-gradient(180deg,#171c2c,#0a0d16);box-shadow:inset 0 calc(var(--u)*.3) 0 #ffffff18,0 calc(var(--u)*1.5) calc(var(--u)*4) #0008}
.s2 .tm::before{content:"";position:absolute;inset:0 0 auto 0;height:calc(var(--u)*1.8);background:linear-gradient(90deg,transparent,var(--c) 18%,var(--c) 82%,transparent)}
.s2 .nm{font-weight:700;letter-spacing:.08em;color:#eef0f7;text-shadow:none}
.s2 .sc{font-weight:800;color:#fff;text-shadow:0 0 calc(var(--u)*5) color-mix(in srgb,var(--c) 80%,transparent),0 calc(var(--u)*.6) calc(var(--u)*1.5) #000a}
.s2 .sb{color:#cdb77f}
.s2 .win{box-shadow:inset 0 0 0 calc(var(--u)*.6) #f1c64a,0 0 calc(var(--u)*7) #f1c64a77}
.s2 .chip{background:transparent;border:calc(var(--u)*.25) solid #cdb77f66}
.s2 .foot{color:#d9c99a}.s2 .bso u:not(.on){background:#ffffff1c}

.s3{background:#000;--led2:#ffd21f;--px:calc(var(--u)*.55);--dm:radial-gradient(circle,#000 66%,transparent 76%) 0 0/var(--px) var(--px)}
.s3 .ttl,.s3 .top .l,.s3 .top .r,.s3 .clk,.s3 .per,.s3 .nm,.s3 .sc,.s3 .sb,.s3 .bso i,.s3 .foot>.chip b{-webkit-mask:var(--dm);mask:var(--dm)}
.s3 .ttl{color:#f6f6f6;font-weight:700;letter-spacing:.12em;filter:drop-shadow(0 0 calc(var(--u)*.7) #fff7)}
.s3 .top .l,.s3 .top .r{color:var(--led2);font-weight:800;filter:drop-shadow(0 0 calc(var(--u)*.8) #ffc40088)}
.s3 .m{border:calc(var(--u)*.35) solid #3a3a3a;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.2) calc(var(--u)*3);background:#060000;box-shadow:inset 0 0 calc(var(--u)*2) #000}
.s3 .clk{color:#ff2a22;text-shadow:none;padding:0;filter:drop-shadow(0 0 calc(var(--u)*1.3) #ff1a1acc)}.s3 .clk.off{color:#ff5a1f}
.s3 .per{background:none;border:0;color:#f4f4f4;font-weight:800;margin-top:calc(var(--u)*.6);padding:0;filter:drop-shadow(0 0 calc(var(--u)*.7) #fff6)}
.s3 .tm{--led:color-mix(in srgb,var(--c) 85%,#fff);background:radial-gradient(circle,#ffffff10 55%,transparent 66%) 0 0/var(--px) var(--px),#000;border:calc(var(--u)*.7) solid #1c1c1c;box-shadow:inset 0 0 calc(var(--u)*3) #000,0 0 0 calc(var(--u)*.25) #353535}
.s3 .nm{color:#f4f4f4;font-weight:800;letter-spacing:.06em;text-shadow:none;filter:drop-shadow(0 0 calc(var(--u)*.9) #fff8)}
.s3 .sc{color:var(--led);font-weight:900;font-family:'Arial Black','Segoe UI',sans-serif;text-shadow:none;filter:brightness(1.3) saturate(1.35) drop-shadow(0 0 calc(var(--u)*1.8) color-mix(in srgb,var(--c) 90%,transparent))}
.s3 .sb{color:var(--led2);filter:drop-shadow(0 0 calc(var(--u)*.8) #ffc40088)}.s3 .sb b{color:#fff}
.s3 .foot{color:#f4f4f4}.s3 .chip{background:#000;border:calc(var(--u)*.25) solid #555}.s3 .chip b{color:var(--led2)}
.s3 .bso{gap:calc(var(--u)*1.6)}.s3 .bso i{width:auto;margin-right:calc(var(--u)*.6);font-size:calc(var(--u)*6);color:#f4f4f4}
.s3 .bso u{width:calc(var(--u)*5);height:calc(var(--u)*5);background:#161616;box-shadow:inset 0 0 calc(var(--u)*1) #000,0 0 0 calc(var(--u)*.2) #2a2a2a}
.s3 .bso u.d0.on{background:radial-gradient(circle at 35% 30%,#c4ffd2,#1fe052 55%,#0b8a2c);box-shadow:0 0 calc(var(--u)*2.8) #1fe052}
.s3 .bso u.d1.on{background:radial-gradient(circle at 35% 30%,#ffe9a8,#ffb81c 55%,#b36d00);box-shadow:0 0 calc(var(--u)*2.8) #ffb81c}
.s3 .bso u.d2.on{background:radial-gradient(circle at 35% 30%,#ffb3a8,#ff3a22 55%,#a01408);box-shadow:0 0 calc(var(--u)*2.8) #ff3a22}
.s3 .win{box-shadow:inset 0 0 0 calc(var(--u)*.7) var(--led2),0 0 calc(var(--u)*7) #ffd21f88}
@media(max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}body{overflow:auto}#ctl{overflow:visible}}
.inning-wrap{flex:1;min-height:0;display:flex;align-items:center}.inning-board{width:100%;table-layout:fixed;border-collapse:collapse;text-align:center;font-size:calc(var(--u)*5);font-variant-numeric:tabular-nums}.inning-board th,.inning-board td{border:1px solid #ffffff30;padding:calc(var(--u)*3) .1em}.inning-board th{color:var(--ac);background:#ffffff0c;font-size:calc(var(--u)*4)}.inning-board .team-cell{width:23%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:.5em;text-align:left}.inning-board .total{color:var(--ac);background:#ffd23f15;font-weight:900}.inning-board .active-inning{background:#ffffff18;box-shadow:inset 0 -3px var(--ac)}.base-result{text-align:center;color:var(--ac);font-weight:800;font-size:calc(var(--u)*5)}
.role-tag{display:inline-block;border-radius:6px;padding:5px 10px;font-weight:900;background:#334155;color:#e2e8f0}.role-tag.attack{background:#ffd23f;color:#241a00}.pc.attacking{outline:2px solid var(--ac);background:#292511}.pc .team-role{margin:6px 0}.board .role-tag{font-size:calc(var(--u)*3.5);padding:.3em .6em}.inning-board .role-tag{display:block;width:max-content;margin:.4em 0 0}.matchup{display:grid;grid-template-columns:1fr 1fr;gap:8px}.matchup>div{background:#ffffff08;border-radius:8px;padding:10px;min-width:0}.matchup strong{display:block;margin:6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.matchup small{margin:0}.board .tm>.role-tag{position:absolute;top:calc(var(--u)*1.8);left:calc(var(--u)*2)}button:disabled{opacity:.3;cursor:default}

/* Distance-readable baseball display */
.possession-mark{position:absolute;top:calc(var(--u)*3);left:calc(var(--u)*3);width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);border-radius:50%;background:#ffe19a;box-shadow:0 0 calc(var(--u)*2) #ffd23f66}
.possession-mark::after{content:"";position:absolute;left:calc(var(--u)*4);top:40%;width:calc(var(--u)*7);height:calc(var(--u)*.35);background:linear-gradient(90deg,#ffe19a,transparent)}
.inning-wrap{padding:0 calc(var(--u)*1);align-items:stretch}
.inning-board{border-collapse:separate;border-spacing:calc(var(--u)*.55) calc(var(--u)*1.3);font-family:'Arial','Malgun Gothic',sans-serif;font-size:calc(var(--u)*8);font-weight:800}
.inning-board th,.inning-board td{border:0;border-radius:calc(var(--u)*1);padding:calc(var(--u)*1) .05em;line-height:1.05}
.inning-board thead th{height:calc(var(--u)*6);font-size:calc(var(--u)*4.4);color:#b7c6dc;background:transparent;font-weight:700}
.inning-board tbody td{background:#172338;color:#f7faff;box-shadow:inset 0 calc(var(--u)*.2) 0 #ffffff08}
.inning-board tbody tr:nth-child(2) td{background:#1d2b42}
.inning-board .team-cell{width:25%;padding-left:calc(var(--u)*2.5);text-align:left;white-space:normal;background:#111d30;color:#fff;position:relative;overflow:hidden}
.inning-board thead .team-cell{background:transparent;color:#b7c6dc;letter-spacing:.12em;font-size:calc(var(--u)*3.4)}
.lineup-label{display:block;font-size:calc(var(--u)*2.7);letter-spacing:.18em;color:#b7c6dc;margin-bottom:calc(var(--u)*1.8);font-weight:700}
.lineup-name{display:block;font-size:calc(var(--u)*5.5);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:.12em}
.inning-board tbody .team-cell::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:calc(var(--u)*.65);border-radius:99px;background:var(--team-color)}
.inning-board .at-bat .team-cell{background:linear-gradient(120deg,#3c3420,#192337)}
.inning-board .at-bat .lineup-label{color:#ffe19a}
.inning-board .at-bat .lineup-label::after{content:" ●";font-size:.85em;color:#ffe19a}
.inning-board .at-bat .team-cell::before{background:#ffe19a;box-shadow:0 0 calc(var(--u)*2) #ffd23f44}
.inning-board .total{width:10%;color:#ffe19a!important;background:#3b3320!important;font-size:calc(var(--u)*10);font-weight:900;box-shadow:none}
.inning-board thead .total{font-size:calc(var(--u)*2.8);letter-spacing:.06em;background:transparent!important}
.inning-board thead .current-column{color:#ffe19a}
.inning-board tbody .active-inning{background:#504328!important;color:#fff5d8;box-shadow:inset 0 calc(var(--u)*.55) 0 #ffe19a}

/* Compact controls; fit the complete panel to the available height. */
#ctl{padding:8px;overflow:hidden;display:block;min-height:0}
#ctl-content{display:flex;flex-direction:column;gap:5px;transform-origin:top left}
#ctl .hd{font-size:15px}#ctl button{padding:7px 5px;font-size:13px;border-radius:7px}
#ctl input{padding:5px 7px;font-size:13px}
#ctl .blk{padding:6px;gap:5px;border-radius:8px}
#ctl .nr{gap:6px}#ctl .nr input{flex:1;width:0}
#ctl .sws{width:auto;flex:0 0 auto;flex-wrap:nowrap;gap:4px}
#ctl .sw{width:19px;height:19px;flex:0 0 19px}
#ctl .seg{gap:5px}#ctl .seg button{padding:6px 3px;font-size:12px}
#ctl #pad{gap:6px}#ctl .pc{padding:6px}#ctl .ps{font-size:42px;line-height:1}
#ctl .pn{font-size:14px}#ctl .pc .team-role{margin:3px 0}
#ctl .role-tag{padding:3px 9px;font-size:12px}
#ctl .pb{gap:4px}#ctl .pb button{padding:6px 0;font-size:18px}
#ctl .g2,#ctl .g3,#ctl .g4{gap:5px}#ctl .ct{font-size:28px}#ctl .ct.s{font-size:18px}
#ctl #opt{display:flex;flex-direction:column;gap:5px}
#ctl .outb{padding:9px;font-size:17px}#ctl details{line-height:1.4;font-size:11px}
@media(max-width:900px){#app{grid-template-rows:min(100dvh,760px) auto}body.out #app{grid-template-rows:1fr}#ctl{overflow:hidden}}

/* More breathing room while preserving the single-screen fit. */
#ctl-content{gap:6.5px}#ctl .blk{padding:8px 6px;gap:6.5px}
#ctl button{padding-top:9px;padding-bottom:9px}#ctl input{padding-top:6.5px;padding-bottom:6.5px}
#ctl .seg button{padding-top:8px;padding-bottom:8px}#ctl .pc{padding-top:8px;padding-bottom:8px}
#ctl .pc .team-role{margin:4px 0}#ctl .pb button{padding-top:8px;padding-bottom:8px}
#ctl #opt{gap:6.5px}#ctl .outb{padding-top:12px;padding-bottom:12px}

/* Full scoreboard themes */
.s1 .inning-board tbody td{background:#152c48;color:#f5faff}
.s1 .inning-board tbody tr:nth-child(2) td{background:#1c3756}
.s1 .inning-board tbody .team-cell{background:#10243b}
.s1 .inning-board .at-bat .team-cell{background:linear-gradient(120deg,#124b65,#152b43)}
.s1 .inning-board .at-bat .lineup-label{color:#6ee7ff}
.s1 .inning-board .at-bat .lineup-label::after{color:#6ee7ff}
.s1 .inning-board .at-bat .team-cell::before{background:#6ee7ff;box-shadow:0 0 calc(var(--u)*2) #6ee7ff55}
.s1 .inning-board tbody .active-inning{background:#17556b!important;color:#fff;box-shadow:inset 0 calc(var(--u)*.55) 0 #6ee7ff}
.s1 .inning-board .total{background:#243c53!important;color:#fff!important}
.s1 .inning-board thead .total{background:transparent!important;color:#8bdcf2!important}
.s1 .inning-board thead .current-column{color:#6ee7ff}

.s2.stadium-board::before{inset:3% 2%;border-color:#b9e9ff55;background:linear-gradient(110deg,transparent,#b4eaff08,transparent)}
.s2.stadium-board .premium-header{grid-template-columns:1fr 3fr 1fr;min-height:calc(var(--u)*10);padding:calc(var(--u)*1) calc(var(--u)*3);border-bottom:1px solid #b4eaff44}
.s2.stadium-board .premium-header b{font-family:'Malgun Gothic','Arial Black',sans-serif;font-weight:900;font-size:calc(var(--u)*5.5);letter-spacing:-.05em;color:#fff4c9;text-shadow:0 2px 0 #89744d,0 4px 4px #000,0 0 22px #ffd56655;white-space:normal;line-height:1.15;overflow-wrap:anywhere}
.s2.stadium-board .premium-header>span{font-size:calc(var(--u)*2.5);color:#cfebf7}
.s2.stadium-board .premium-arena{grid-template-columns:1fr 1.15fr 1fr}
.s2.stadium-board .nm{font-weight:900;color:#fff;letter-spacing:-.05em;text-shadow:0 3px 3px #000,0 0 15px #b3edff44}
.s2.stadium-board .premium-arena .sc{font-size:calc(var(--u)*35);font-weight:1000;text-shadow:0 3px 0 #9bafbd,0 7px 4px #000,0 0 25px #b1eeff33}
.s2.stadium-board .premium-clock .clk,.s2.stadium-board .premium-full-clock .clk{font-size:calc(var(--u)*12);padding:calc(var(--u)*3) 0;line-height:1;color:#e9fbff;letter-spacing:0;transform:none;font-style:normal}
.arena-led{display:inline-flex;gap:.12em;align-items:center;vertical-align:middle;filter:drop-shadow(0 0 .045em #b8f7ff) drop-shadow(0 0 .12em #82dfff66)}
.led-digit{display:inline-block;position:relative;width:.57em;height:1em;flex:none}
.led-digit i{position:absolute;background:#b3d9e510;display:block}
.led-digit i.on{background:currentColor}
.led-digit .seg-a,.led-digit .seg-g,.led-digit .seg-d{width:.43em;height:.13em;left:.07em;clip-path:polygon(13% 0,87% 0,100% 50%,87% 100%,13% 100%,0 50%)}
.led-digit .seg-a{top:0}.led-digit .seg-g{top:.435em}.led-digit .seg-d{bottom:0}
.led-digit .seg-b,.led-digit .seg-c,.led-digit .seg-e,.led-digit .seg-f{height:.42em;width:.13em;clip-path:polygon(50% 0,100% 15%,100% 85%,50% 100%,0 85%,0 15%)}
.led-digit .seg-b{right:0;top:.065em}.led-digit .seg-c{right:0;bottom:.065em}.led-digit .seg-f{left:0;top:.065em}.led-digit .seg-e{left:0;bottom:.065em}
.led-colon{display:flex;flex-direction:column;justify-content:space-around;height:.7em;width:.12em;flex:none}.led-colon i{width:.12em;height:.12em;background:currentColor;border-radius:2px}.led-dot{font-size:.7em;align-self:flex-end}.led-label{font-family:'Malgun Gothic',sans-serif;font-size:.5em;font-weight:900}
.s2.stadium-board .premium-clock .per{font-weight:900;background:linear-gradient(#16323da8,#06141dcc);box-shadow:0 0 20px #6cd9ff22,inset 0 1px #c0f3ff44}
.s2.stadium-board .premium-full-clock{min-height:calc(var(--u)*23)}
.s2.stadium-board .premium-full-clock .clk{font-size:calc(var(--u)*12)}
.s2.stadium-board .premium-summary .inning-board tbody td,.s2.stadium-board .inning-board tbody td{background:#061622aa;backdrop-filter:blur(3px)}
.s2.stadium-board .inning-board .total{background:#294c62c9!important;color:#fff7cd!important}
.s2.stadium-board .premium-summary{height:calc(var(--u)*19)}

function boardCommand(cmd){
 if(cmd.action==='buzzer'){beep();commit();return}
 if(cmd.action==='shot-preset'){if(cmd.delta>0&&S.sp==='basket'&&[12,14].includes(cmd.count)){resetShot(cmd.count,true);commit()}return}
 if(S.sp==='soft'&&S.softNoGame)return;

 if(S.sp==='jokgu'&&cmd.action==='period-score'&&cmd.delta>0&&(S.hs[cmd.period]||S.win>=0||S.sc[cmd.team]>=19))return;

 if(S.sp==='jokgu'&&cmd.action==='jokgu-sub'){if(S.win>=0)return;act(()=>{S.jokguSubs||={};S.jokguSubs[S.pd]||=[0,0];S.jokguSubs[S.pd][cmd.team]=Math.max(0,Math.min(3,S.jokguSubs[S.pd][cmd.team]+cmd.delta))});return}
 if(S.sp==='jokgu'&&cmd.action==='jokgu-timeout'){if(cmd.delta<0){if(S.timeout?.running){S.timeout.remaining=timeoutRemaining();S.timeout.running=false;commit()}return}if(S.win>=0||S.timeout?.running)return;S.jokguUsed||={};S.jokguUsed[S.pd]||=[false,false];if(S.jokguUsed[S.pd][cmd.team])return;S.jokguUsed[S.pd][cmd.team]=true;S.timeout={team:cmd.team,duration:60,remaining:60,running:true,startedAt:Date.now()};commit();return}

 if(cmd.action==='disc-timeout'&&S.sp==='disc'){discTimeoutCommand(cmd.team,cmd.delta);return}

 if(['volley','jokgu'].includes(S.sp)&&S.win>=0&&cmd.delta>0&&['score','period-score'].includes(cmd.action))return;

 if(cmd.action==='base-period'&&SP[S.sp].k==='base'){per(cmd.delta);return}

 if(cmd.action==='soccer-card'&&['soccer','futsal'].includes(S.sp)&&[0,1].includes(cmd.team)&&[0,1].includes(cmd.count)){act(()=>{if(!S.cards)S.cards=[[0,0],[0,0]];S.cards[cmd.count][cmd.team]=Math.max(0,S.cards[cmd.count][cmd.team]+cmd.delta)});return}

 if(cmd.action==='shot-clock'){
  if(!['basket','b3'].includes(S.sp)||S.win>=0)return;
  if(cmd.delta===0){resetShot();S.attackTeam=(S.attackTeam??0)===0?1:0}
  else if(cmd.delta<0||S.shot?.running)basketWhistle();
  else startShot();
  commit();return;
 }

 if(cmd.action==='time-preset'||cmd.action==='division'){cycleDivision(cmd.direction??cmd.delta);return}
 if(cmd.action?.startsWith('timeout-')){
  if(!['volley','jokgu'].includes(S.sp))return;
  if(S.sp==='jokgu'){if(S.timeout?.running&&cmd.delta<0){S.timeout.remaining=timeoutRemaining();S.timeout.running=false;commit()}else if(S.timeout&&!S.timeout.running&&S.timeout.remaining>0&&cmd.delta>0){S.timeout.running=true;S.timeout.startedAt=Date.now();commit()}return}
  if(cmd.delta===0){const duration=S.timeout?.duration??30,next=duration===30?60:30;S.timeout=next?{team:S.timeout?.team??0,duration:next,remaining:next,running:false,startedAt:0}:null;commit();return}
  if(cmd.delta>0){if(S.timeout?.running)return;timeoutAction('start');return}
  if(cmd.delta<0&&S.timeout?.running){S.timeout.remaining=timeoutRemaining();S.timeout.running=false;commit()}
  return;
 }
 if(cmd.action==='base-runner'||cmd.action==='base-hit'){
  if(SP[S.sp].k!=='base')return;
  if(cmd.action==='base-hit'){if(cmd.delta>0)act(()=>{prepareScoreEdit();reachBase()});return}
  if(![0,1,2].includes(cmd.count))return;act(()=>{const b=ensureBases();b[cmd.count]=!b[cmd.count];syncBases()});return;
 }
 if(cmd.action==='view'){if(cmd.delta<0)return;const full=S.baseMode==='full';baseballMode(full?'normal':'full');return}


 if(cmd.action==='dodge-record'&&S.sp==='dodge'){editDodgeRecord(cmd.period,cmd.team,cmd.delta);return}
 if(cmd.action==='period-score'&&SP[S.sp].k==='set'&&!SP[S.sp].tennis&&Number.isInteger(cmd.period)&&cmd.period>=0&&[0,1].includes(cmd.team)&&S.hs[cmd.period]){
  H.push(snapshot());const scores=S.hs[cmd.period].split(':').map(Number);scores[cmd.team]=Math.max(0,scores[cmd.team]+cmd.delta);S.hs[cmd.period]=scores.join(':');refreshSetResult();commit();return;
 }
 if(cmd.action==='period-score'){
  const i=cmd.team,j=cmd.period,p=SP[S.sp];
  if(!Number.isInteger(j)||j<0||![0,1].includes(i))return;
  if(p.k==='set'&&j>=S.hs.length&&j!==S.pd-1)return toast('현재 세트 점수를 조절하세요');
  act(()=>{const before=S.sc[i];if(p.tm||p.k==='base')prepareScoreEdit();if(p.k==='base'){ensureInnings();S.innings[i][j]=Math.max(0,(S.innings[i][j]||0)+cmd.delta);sumInnings()}
   else if(hasPeriods()){ensureQuarters();S.quarters[i][j]=Math.max(0,(S.quarters[i][j]||0)+cmd.delta);S.sc=S.quarters.map(r=>r.reduce((a,b)=>a+(b||0),0))}
   else if(p.k==='set'){if(j<S.hs.length){const scores=S.hs[j].split(':').map(Number);scores[i]=Math.max(0,scores[i]+cmd.delta);S.hs[j]=scores.join(':');S.st=[0,0];S.hs.forEach(v=>{const [a,b]=v.split(':').map(Number);if(a!==b)S.st[a>b?0:1]++});if(Math.max(...S.st)>=S.cf.nd)S.win=S.st[0]>S.st[1]?0:1}else S.sc[i]=Math.max(0,S.sc[i]+cmd.delta)}
   if(S.sc[i]!==before)basketScoreChanged(i,cmd.delta);
  });
 }else if(cmd.action==='score'){

  if(SP[S.sp].k==='base'){act(()=>{prepareScoreEdit();ensureInnings();const i=cmd.team,j=S.pd-1;S.innings[i][j]=Math.max(0,(S.innings[i][j]||0)+cmd.delta);sumInnings()})}else add(cmd.team,cmd.delta);
 }else if(cmd.action==='foul'&&SP[S.sp].fl){changeFoul(cmd.team,cmd.delta)}else if(cmd.action==='clock'){const p=SP[S.sp];if(!(p.tm||p.sw||p.k==='base'))return;if(cmd.delta>0){if(S.sp==='basket'||S.sp==='b3')tog();else if(!S.run)tog()}else if(cmd.delta<0&&S.run&&S.sp!=='soccer')tog()}
 else if(cmd.action==='count'&&SP[S.sp].k==='base'){if(cmd.delta>0)ACT.bso(0,cmd.count);else act(()=>{prepareScoreEdit();S.bso[cmd.count]=Math.max(0,S.bso[cmd.count]-1)})}
}
