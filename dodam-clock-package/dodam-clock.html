<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b42">
<title>세종시 실시간 현황 | 도담중학교</title>
<style>
:root{color-scheme:dark;--text:#f7fbff;--muted:#b8def8;--line:#c4e9ff42}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:radial-gradient(ellipse at 86% 16%,#2486c866,transparent 36%),linear-gradient(125deg,#061936,#0a3971 64%,#124a7d);overflow-x:hidden}
.photo{position:fixed;z-index:-2;inset:0 0 0 auto;width:57vw;background:url('school-faded-clean.png') center/cover no-repeat;opacity:.38;filter:blur(.5px);mask-image:linear-gradient(90deg,transparent,#000 28%)}
.veil{position:fixed;z-index:-1;inset:0;background:linear-gradient(100deg,#061a3df2 0%,#071e44c8 53%,#092b5466 100%)}
main{width:min(1600px,100%);min-height:100vh;margin:auto;padding:clamp(12px,2vh,22px) clamp(10px,1.5vw,24px) 12px;display:flex;flex-direction:column;justify-content:flex-start;gap:clamp(10px,1.5vh,18px)}
header{display:flex;align-items:center;gap:16px}.crest{width:56px;height:56px;object-fit:cover;border-radius:50%;box-shadow:0 3px 16px #00122c55}.school{font-size:clamp(18px,1.8vw,24px);font-weight:700}.eng{font-size:11px;letter-spacing:.16em;color:var(--muted);margin-top:5px}.school-line{display:flex;align-items:center;gap:clamp(14px,2.5vw,34px);flex-wrap:wrap;flex:1}.date-wrap{margin-left:auto;text-align:right}.date{font-size:clamp(40px,4vw,60px);font-weight:900;letter-spacing:.01em;color:#fff;text-shadow:0 4px 22px #00132d88;text-align:right;white-space:nowrap}.calendar-note{font-size:.48em;font-weight:800;letter-spacing:.015em;color:#c9eaff;text-shadow:0 2px 12px #00132d88;white-space:nowrap;vertical-align:baseline}
.hero{padding:clamp(8px,1.2vh,14px) 0 0}
.hero-view{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center;padding:0 4px;border:0;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none}
.hero-view.notice{background:transparent;border:0;box-shadow:none;backdrop-filter:none}
.hero-message{max-width:1100px;font-size:clamp(48px,8vw,112px);line-height:1.22;font-weight:900;letter-spacing:-.045em;text-shadow:0 6px 28px #00132d88}
.schedule-title{font-size:clamp(24px,3vw,42px);color:#c7edff;margin-bottom:18px;letter-spacing:0}
.schedule-items{font-size:clamp(26px,3.8vw,54px);line-height:1.22}
.schedule-line{width:100%;font-size:clamp(32px,4.2vw,68px);line-height:1.24;font-weight:900;color:#fff;text-shadow:0 4px 24px #00152f;white-space:normal;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,22px);overflow:hidden}
.schedule-heading{color:#b9efff;font-size:.86em}.schedule-content{color:#fff;font-size:1em;overflow-wrap:anywhere}.next-week-preview{font-size:clamp(15px,1.5vw,22px);line-height:1.35;font-weight:700;color:#d5eafa;opacity:.82;text-shadow:0 2px 10px #00152f}
.schedule-items small{display:block;font-size:.48em;line-height:1.35;color:#d3ebfb;margin-top:10px}
.welcome-layout{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(20px,4vh,44px)}
.welcome-layout .hero-message{max-width:none;white-space:nowrap;font-size:clamp(34px,6.4vw,96px);letter-spacing:-.06em}
.schedule-strip{width:min(1100px,100%);padding-top:clamp(16px,2.5vh,28px);border-top:1px solid #d9f1ff66}
.schedule-strip-title{font-size:clamp(20px,2.5vw,32px);font-weight:800;color:#c7edff;margin-bottom:8px}
.schedule-strip-items{font-size:clamp(22px,3.3vw,42px);font-weight:800;line-height:1.4}
.schedule-strip-items small{display:block;font-size:.58em;color:#d3ebfb}
.schedule-week-line{display:flex;justify-content:center;align-items:baseline;flex-wrap:wrap;gap:6px 14px}
.schedule-week-line+ .schedule-week-line{margin-top:8px}
.schedule-week-group{margin:9px 0}
.schedule-week-group>div{font-size:.88em;line-height:1.18;margin:4px 0}
.schedule-week-group strong{display:block;color:#c7edff;margin-bottom:6px}
.schedule-week-group small{display:block;font-size:.56em;color:#d3ebfb}
.meal-panel{width:min(1250px,100%)}
.meal-heading{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:clamp(8px,1.2vw,18px);margin-bottom:10px}.meal-title{font-size:clamp(27px,3.6vw,47px);font-weight:900;color:#c7edff;margin:0}.meal-calorie{font-size:clamp(18px,1.8vw,26px);font-weight:800;color:#fff}
.meal-row{font-size:clamp(23px,2.88vw,40px);font-weight:800;line-height:1.5}
.next-meal-preview{width:100%;margin-top:clamp(7px,1vh,12px);padding-top:clamp(6px,.8vh,10px);border-top:1px solid #c4e9ff45;font-size:clamp(12px,1.1vw,16px);line-height:1.35;font-weight:700;color:#d8ebf8;opacity:.9;text-align:left}.meal-row small{display:block;width:100%;max-width:none;font-size:clamp(20px,2.52vw,32px);font-weight:800;letter-spacing:.035em;line-height:1.35;color:#f0f8ff;margin-top:8px;text-align:left;white-space:normal}
.hero-view .clock{margin:0;font-size:clamp(110px,31vw,500px)}
.hero-weather{display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,24px);font-size:clamp(30px,4.2vw,60px);font-weight:900;line-height:1.2;text-shadow:0 4px 24px #00152f}.hero-weather-icon{font-size:1.25em}.hero-weather-details{font-size:.62em;color:#e1f4ff;margin-top:8px}
.clock{width:100%;display:flex;align-items:baseline;justify-content:flex-start;gap:clamp(28px,3vw,48px);margin:0;white-space:nowrap;line-height:.98;font-size:clamp(110px,31vw,500px);font-variant-numeric:tabular-nums}
.clock-main{display:flex;flex:0 0 auto;align-items:baseline;justify-content:flex-start;gap:.015em;font-family:"Bahnschrift","Arial",sans-serif;font-weight:900;letter-spacing:-.03em;line-height:1;color:#fff;text-shadow:0 8px 40px #020e2a66}.clock-colon{color:#c8ecff;letter-spacing:-.06em;margin:0 .015em}.seconds{font-family:"Bahnschrift","Arial",sans-serif;font-size:.4em;font-weight:800;letter-spacing:-.055em;color:#d7f2ff;text-shadow:0 5px 28px #020e2a88;margin-left:0}
.date-number{font-size:1.16em;font-weight:900;letter-spacing:-.035em}.date-unit{font-size:.72em;font-weight:700;opacity:.96}.date-weekday{font-size:.72em;font-weight:700;margin-left:.16em}
.flip-digit{display:inline-block}.flip-card{position:relative;display:inline-grid;vertical-align:baseline;line-height:1;perspective:900px;isolation:isolate}.flip-card>span{grid-area:1/1;display:block;backface-visibility:hidden}.flip-card .digit-top{clip-path:inset(0 0 50% 0)}.flip-card .digit-bottom{clip-path:inset(50% 0 0 0)}.flip-card .digit-old-top{z-index:2;clip-path:inset(0 0 50% 0);transform-origin:bottom;animation:flip-top .48s ease-in forwards}.flip-card .digit-new-bottom{z-index:1;clip-path:inset(50% 0 0 0);transform-origin:top;transform:rotateX(90deg);animation:flip-bottom .48s .08s ease-out forwards}@keyframes flip-top{to{transform:rotateX(-90deg)}}@keyframes flip-bottom{to{transform:rotateX(0)}}.seconds{display:inline-block}
.weather-board{display:grid;grid-template-columns:minmax(280px,.95fr) minmax(380px,1.25fr);align-items:stretch;border:1px solid var(--line);border-radius:24px;background:linear-gradient(110deg,#d9f1ff24,#ffffff0d);box-shadow:0 14px 40px #00142d35;backdrop-filter:blur(8px);overflow:hidden}#weather-board[data-view="schedule"],#weather-board[data-view="meals"]{display:flex;align-items:center;justify-content:center;min-height:clamp(130px,19vh,220px);padding:clamp(12px,1.8vw,24px);text-align:center}
.current{display:grid;grid-template-columns:auto 1fr;align-content:center;align-items:center;gap:0 17px;padding:clamp(22px,2.8vw,38px);border-right:1px solid var(--line)}.current-icon{grid-row:1/4;font-size:clamp(72px,8.4vw,110px);filter:drop-shadow(0 4px 9px #00172b66)}.current-label{font-size:clamp(23px,2.16vw,29px);font-weight:700;color:#e0f3ff}.current-temp{font-size:clamp(70px,7.56vw,98px);font-weight:800;letter-spacing:-.04em;line-height:1.08}.current-desc{font-size:clamp(26px,2.4vw,34px);font-weight:800;color:#fff}.current-details{grid-column:1/-1;display:flex;gap:28px;margin-top:18px;color:#f0f8ff;font-size:clamp(23px,2.16vw,29px);font-weight:700}
.forecast{display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:clamp(20px,2.8vw,38px) clamp(18px,2.8vw,38px);gap:0}.forecast-slot{min-width:0;padding:0 clamp(12px,2vw,26px)}.forecast-slot+ .forecast-slot{border-left:1px solid var(--line)}.when{font-size:clamp(24px,2.22vw,30px);font-weight:800;color:#f0f9ff}.forecast-info{display:flex;align-items:center;gap:clamp(9px,1.4vw,17px);margin-top:14px}.ficon{font-size:clamp(53px,6vw,79px);filter:drop-shadow(0 4px 7px #00172b55)}.forecast-text{min-width:0}.cond{font-size:clamp(23px,2.16vw,29px);font-weight:800;white-space:nowrap}.ftemp{font-size:clamp(41px,3.96vw,53px);font-weight:800;letter-spacing:-.03em;margin-top:3px}.rain{font-size:clamp(20px,1.8vw,24px);font-weight:700;color:#e0f1ff;margin-top:4px}
.status{font-size:12px;color:#acd3ef;margin-top:9px}
@media(max-width:760px){body{overflow:auto}.photo{width:90vw;opacity:.28}main{min-height:100vh;gap:10px;padding:10px 12px}header{gap:11px}.crest{width:46px;height:46px}.school-line{gap:4px 12px}.date{font-size:clamp(25px,6.5vw,38px);white-space:normal}.calendar-note{font-size:.48em}.hero-view{min-height:0;padding:0 2px;gap:0}.hero-view .clock{font-size:clamp(94px,27vw,220px)}.hero-weather{font-size:clamp(22px,5vw,38px);flex-direction:column}.clock{font-size:clamp(94px,27vw,220px);gap:clamp(18px,4vw,32px)}.clock-main{gap:.015em}.seconds{font-size:.36em}.weather-board{grid-template-columns:1fr}.current{border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}.current-details{margin-top:12px}.forecast{padding:12px 8px}.forecast-slot{padding:0 11px}.ficon{font-size:clamp(46px,12vw,65px)}.when{font-size:clamp(20px,5.6vw,25px)}.cond{font-size:clamp(19px,5.16vw,24px)}.ftemp{font-size:clamp(35px,8.4vw,44px)}.rain{font-size:clamp(17px,4.56vw,20px)}}
@media(max-width:390px){.forecast-slot{padding:0 7px}.forecast-info{gap:7px}.when{font-size:14px}.rain{font-size:11px}}
</style></head>
<body><div class="photo" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div><main>
<header><img class="crest" src="school-crest.jpg" alt="도담중학교 교표"><div class="school-line"><div><div class="school">도담중학교</div><div class="eng">DODAM MIDDLE SCHOOL</div></div><div class="date-wrap"><div class="date" id="date">2026년 10월 19일 월요일</div></div></div></header>
<section class="hero" aria-live="polite"><div class="hero-view" id="hero-view"><div class="clock" id="clock"><div class="clock-main"><span class="flip-digit" id="clock-hours">--</span><span class="clock-colon">:</span><span class="flip-digit" id="clock-minutes">--</span></div><span class="seconds flip-digit" id="clock-seconds">--</span></div></div></section>
<section class="weather-board" id="weather-board" aria-live="polite">
  <div class="current"><span class="current-icon" id="icon">⛅</span><div class="current-label">세종시 현재 날씨</div><div class="current-temp" id="temp">--°</div><div class="current-desc" id="desc">날씨 정보를 불러오는 중</div><div class="current-details"><span id="feel">체감 --°</span><span id="humidity">습도 --%</span></div></div>
  <div class="forecast">
    <article class="forecast-slot"><div class="when">오늘 오후</div><div class="forecast-info"><span class="ficon" id="icon-today-pm">⛅</span><div class="forecast-text"><div class="cond" id="cond-today-pm">불러오는 중</div><div class="ftemp" id="temp-today-pm">--°</div><div class="rain" id="rain-today-pm">강수 --%</div></div></div></article>
    <article class="forecast-slot"><div class="when">내일 오전</div><div class="forecast-info"><span class="ficon" id="icon-tomorrow-am">🌤️</span><div class="forecast-text"><div class="cond" id="cond-tomorrow-am">불러오는 중</div><div class="ftemp" id="temp-tomorrow-am">--°</div><div class="rain" id="rain-tomorrow-am">강수 --%</div></div></div></article>
  </div>
</section>
</main>
<script src="neis-config.js"></script>
<script>
const $=id=>document.getElementById(id),tz={timeZone:'Asia/Seoul'};
function updateFlip(id,next){const el=$(id),prev=el.dataset.value;if(prev===next)return;el.dataset.value=next;if(!prev){el.textContent=next;return}el.classList.add('flip-card');el.innerHTML=`<span class="digit-bottom">${next}</span><span class="digit-old-top">${prev}</span><span class="digit-new-bottom">${next}</span><span class="digit-top">${next}</span>`;setTimeout(()=>{if(el.dataset.value===next)el.textContent=next},560)}
function updateStatic(id,next){const el=$(id);if(el.textContent!==next)el.textContent=next}
let weekEvents={current:[],next:[]},todayMeals=[],nextMeals=[],scheduleError="",lastWeatherUpdate=0,weatherSnapshot=null,calendarDayLabel="";const weatherBoardTemplate=document.getElementById("weather-board").innerHTML;
function hasWeekEvents(){return weekEvents.current.length+weekEvents.next.length>0}
function renderWeekEvents(container,compact=false){container.replaceChildren();for(const [label,events] of [['이번 주',weekEvents.current],['다음 주',weekEvents.next]]){if(!events.length)continue;const group=document.createElement('div');group.className=compact?'schedule-week-line':'schedule-week-group';const heading=document.createElement(compact?'span':'strong');heading.textContent=label+' ';group.append(heading);events.forEach(event=>{const item=document.createElement(compact?'span':'div');item.textContent=`${event.date} ${event.name}`;group.append(item)});container.append(group)}}
function weekRange(){const ymd=dayKey(new Date()).replaceAll('-',''),monday=new Date(Date.UTC(+ymd.slice(0,4),+ymd.slice(4,6)-1,+ymd.slice(6,8))),weekday=monday.getUTCDay()||7;monday.setUTCDate(monday.getUTCDate()-weekday+1);const currentFrom=monday.toISOString().slice(0,10).replaceAll('-','');monday.setUTCDate(monday.getUTCDate()+6);const currentTo=monday.toISOString().slice(0,10).replaceAll('-','');monday.setUTCDate(monday.getUTCDate()+1);const nextFrom=monday.toISOString().slice(0,10).replaceAll('-','');monday.setUTCDate(monday.getUTCDate()+6);const nextTo=monday.toISOString().slice(0,10).replaceAll('-','');return{currentFrom,currentTo,nextFrom,nextTo,from:currentFrom,to:nextTo}}
function setHero(){const sec=Number(new Intl.DateTimeFormat('en-US',{...tz,second:'2-digit'}).format(new Date()));let view='weather';if(sec>=10&&sec<25)view=weekEvents.current.length?'schedule':'weather';else if(sec>=40&&sec<55)view='meals';const board=$('weather-board');if(board.dataset.view===view)return;board.dataset.view=view;if(view==='weather'){board.innerHTML=weatherBoardTemplate;if(weatherSnapshot)for(const [id,value] of Object.entries(weatherSnapshot))$(id).textContent=value;if(Date.now()-lastWeatherUpdate>15*60*1000)weather();return}board.replaceChildren();if(view==='schedule'){const panel=document.createElement('div');panel.className='schedule-line';const title=document.createElement('div');title.className='schedule-heading';title.textContent='이번 주 학사일정';const content=document.createElement('div');content.className='schedule-content';content.textContent=scheduleError||(weekEvents.current.length?weekEvents.current.map(event=>event.date+' '+event.name).join(' · '):'일정 없음');panel.append(title,content);if(weekEvents.next.length){const next=document.createElement('div');next.className='next-week-preview';next.textContent='다음 주 학사일정　'+weekEvents.next.map(event=>event.date+' '+event.name).join(' · ');panel.append(next)}board.append(panel)}else{const panel=document.createElement('div');panel.className='meal-panel';const heading=document.createElement('div');heading.className='meal-heading';const title=document.createElement('div');title.className='meal-title';title.textContent='오늘의 학교급식';heading.append(title);const calories=todayMeals.map(meal=>meal.cal).filter(Boolean);if(calories.length){const calorie=document.createElement('span');calorie.className='meal-calorie';calorie.textContent=calories.join(' · ');heading.append(calorie)}panel.append(heading);if(todayMeals.length){todayMeals.forEach(meal=>{const row=document.createElement('div');row.className='meal-row';row.textContent=meal.menu.replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim();panel.append(row)})}else{const empty=document.createElement('div');empty.className='meal-row';empty.textContent='오늘 급식 정보가 없습니다.';panel.append(empty)}if(nextMeals.length){const preview=document.createElement('div');preview.className='next-meal-preview';preview.textContent=nextMealLabel()+' 급식　'+nextMeals.map(meal=>meal.menu).join(' · ');panel.append(preview)}board.append(panel)}}function tick(){const n=new Date(),p=new Intl.DateTimeFormat('ko-KR',{...tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(n),v=k=>p.find(x=>x.type===k)?.value||'00';updateFlip('clock-hours',v('hour'));updateFlip('clock-minutes',v('minute'));updateStatic('clock-seconds',v('second'));const d=new Intl.DateTimeFormat('ko-KR',{...tz,year:'numeric',month:'numeric',day:'numeric',weekday:'long'}).formatToParts(n),part=k=>d.find(x=>x.type===k)?.value||'',w=part('weekday');$('date').innerHTML=`<span class="date-number">${part('year')}</span><span class="date-unit">년</span> <span class="date-number">${part('month')}</span><span class="date-unit">월</span> <span class="date-number">${part('day')}</span><span class="date-unit">일</span><span class="date-weekday">${w}</span>${calendarDayLabel?`<span class="calendar-note"> ${calendarDayLabel}</span>`:``}`;setHero()}
const codes={0:['맑음','☀️'],1:['대체로 맑음','🌤️'],2:['구름 조금','⛅'],3:['흐림','☁️'],45:['안개','🌫️'],48:['안개','🌫️'],51:['약한 이슬비','🌦️'],53:['이슬비','🌦️'],55:['강한 이슬비','🌧️'],56:['어는 이슬비','🌧️'],57:['강한 어는 이슬비','🌧️'],61:['약한 비','🌦️'],63:['비','🌧️'],65:['강한 비','🌧️'],66:['어는 비','🌧️'],67:['강한 어는 비','🌧️'],71:['약한 눈','🌨️'],73:['눈','🌨️'],75:['강한 눈','❄️'],77:['싸락눈','🌨️'],80:['소나기','🌦️'],81:['소나기','🌧️'],82:['강한 소나기','⛈️'],85:['눈 소나기','🌨️'],86:['강한 눈 소나기','❄️'],95:['뇌우','⛈️'],96:['우박 동반 뇌우','⛈️'],99:['강한 뇌우','⛈️']};
function dayKey(date){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(date)}
async function weather(){const board=document.getElementById('weather-board');if(board.dataset.view!=='weather')return;const url='https://api.open-meteo.com/v1/forecast?latitude=36.4800&longitude=127.2890&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code&hourly=temperature_2m,weather_code,precipitation_probability&timezone=Asia%2FSeoul&past_days=1&forecast_days=2';try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(board.dataset.view!=='weather')return;const c=d.current,h=d.hourly,[label,icon]=codes[c.weather_code]||['날씨 정보','🌤️'];$('icon').textContent=icon;$('temp').textContent=Math.round(c.temperature_2m)+'°';$('desc').textContent=label;$('feel').textContent=`체감 ${Math.round(c.apparent_temperature)}°`;$('humidity').textContent=`습도 ${c.relative_humidity_2m}%`;const times=new Map(h.time.map((x,i)=>[x,i]));const today=dayKey(new Date()),tomorrow=dayKey(new Date(Date.now()+86400000));for(const [key,day,hour] of [['today-pm',today,15],['tomorrow-am',tomorrow,9]]){const idx=times.get(`${day}T${String(hour).padStart(2,'0')}:00`);const condition=idx==null?null:(codes[h.weather_code[idx]]||['날씨 정보','🌤️']);$('icon-'+key).textContent=condition?.[1]||'⛅';$('cond-'+key).textContent=condition?.[0]||'예보 없음';$('temp-'+key).textContent=idx==null?'--°':`${Math.round(h.temperature_2m[idx])}°`;const chance=idx==null?null:h.precipitation_probability?.[idx];$('rain-'+key).textContent=`강수 ${chance??'--'}%`}weatherSnapshot=Object.fromEntries(['icon','temp','desc','feel','humidity','icon-today-pm','cond-today-pm','temp-today-pm','rain-today-pm','icon-tomorrow-am','cond-tomorrow-am','temp-tomorrow-am','rain-tomorrow-am'].map(id=>[id,$(id).textContent]));lastWeatherUpdate=Date.now()}catch{if(board.dataset.view!=='weather')return;$('desc').textContent='날씨 정보를 불러오지 못했습니다';$('feel').textContent='';$('humidity').textContent='인터넷 연결을 확인해 주세요';weatherSnapshot=Object.fromEntries(['icon','temp','desc','feel','humidity','icon-today-pm','cond-today-pm','temp-today-pm','rain-today-pm','icon-tomorrow-am','cond-tomorrow-am','temp-tomorrow-am','rain-tomorrow-am'].map(id=>[id,$(id).textContent]));lastWeatherUpdate=Date.now()}}async function fetchNeisXml(endpoint,params,apiKey){const q=new URLSearchParams({KEY:apiKey,Type:'xml',pIndex:'1',pSize:'100',...params});const response=await fetch('https://open.neis.go.kr/hub/'+endpoint+'?'+q,{cache:'no-store'});if(!response.ok)throw Error('NEIS HTTP '+response.status);const xml=new DOMParser().parseFromString(await response.text(),'application/xml');if(xml.querySelector('parsererror'))throw Error('NEIS XML parse error');const code=xml.querySelector('RESULT CODE')?.textContent?.trim();if(code&&code!=='INFO-000'&&code!=='INFO-200')throw Error('NEIS API '+code);return xml}
function heroViewRefresh(){const board=document.getElementById('weather-board');delete board.dataset.view;setHero()}
async function loadSchedule(){weekEvents={current:[],next:[]};scheduleError='';const apiKey=window.DODAM_NEIS_API_KEY||'';if(!apiKey){scheduleError='학사일정 API 설정이 없습니다';heroViewRefresh();return}const range=weekRange(),cacheKey='dodam-neis-weeks-v4-'+range.currentFrom;try{const cached=JSON.parse(localStorage.getItem(cacheKey)||'null');if(cached&&Date.now()-cached.savedAt<6*60*60*1000&&cached.weekEvents){weekEvents={current:(cached.weekEvents.current||[]).filter(event=>! /휴업일/.test(event.name)),next:(cached.weekEvents.next||[]).filter(event=>! /휴업일/.test(event.name))};heroViewRefresh();return}}catch{}try{let school;try{const saved=JSON.parse(localStorage.getItem('dodam-neis-school')||'null');if(saved&&saved.name==='도담중학교'&&saved.officeCode&&saved.schoolCode&&Date.now()-saved.savedAt<30*24*60*60*1000)school=saved}catch{}if(!school){const info=await fetchNeisXml('schoolInfo',{SCHUL_NM:'도담중학교'},apiKey);const matches=[...info.getElementsByTagName('row')].map(row=>({name:row.getElementsByTagName('SCHUL_NM')[0]?.textContent?.trim()||'',officeCode:row.getElementsByTagName('ATPT_OFCDC_SC_CODE')[0]?.textContent?.trim()||'',schoolCode:row.getElementsByTagName('SD_SCHUL_CODE')[0]?.textContent?.trim()||''})).filter(row=>row.name==='도담중학교'&&row.officeCode&&row.schoolCode);const sejong=matches.filter(row=>row.officeCode==='I10');school=sejong.length===1?sejong[0]:matches.length===1?matches[0]:null;if(!school)throw Error('도담중학교 기관을 하나로 확인할 수 없습니다');localStorage.setItem('dodam-neis-school',JSON.stringify({...school,savedAt:Date.now()}))}const schedule=await fetchNeisXml('SchoolSchedule',{ATPT_OFCDC_SC_CODE:school.officeCode,SD_SCHUL_CODE:school.schoolCode,AA_FROM_YMD:range.from,AA_TO_YMD:range.to},apiKey);const rows=[...schedule.getElementsByTagName('row')].map(row=>({ymd:row.getElementsByTagName('AA_YMD')[0]?.textContent?.trim()||'',name:row.getElementsByTagName('EVENT_NM')[0]?.textContent?.trim()||''})).filter(row=>row.ymd&&row.name&&!/휴업일/.test(row.name));const makeEvents=entries=>{const seen=new Set();return entries.filter(row=>{const name=row.name.replace(/\s+/g,' ').trim();if(seen.has(name))return false;seen.add(name);return true}).map(row=>({date:`${Number(row.ymd.slice(6,8))}일`,name:row.name}))};weekEvents.current=makeEvents(rows.filter(row=>row.ymd>=range.currentFrom&&row.ymd<=range.currentTo));weekEvents.next=makeEvents(rows.filter(row=>row.ymd>=range.nextFrom&&row.ymd<=range.nextTo));localStorage.setItem(cacheKey,JSON.stringify({savedAt:Date.now(),weekEvents}))}catch{weekEvents={current:[],next:[]};scheduleError='학사일정 정보를 불러오지 못했습니다'}heroViewRefresh()}
function nextMealYmd(){const today=dayKey(new Date()),weekday=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',weekday:'short'}).format(new Date());const [year,month,date]=today.split('-').map(Number);return new Date(Date.UTC(year,month-1,date+(weekday==='Fri'?3:1))).toISOString().slice(0,10).replaceAll('-','')}
function nextMealLabel(){const weekday=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',weekday:'short'}).format(new Date());return weekday==='Fri'?'다음 주 월요일':'내일'}
async function getSchoolInfo(apiKey){let school;try{const saved=JSON.parse(localStorage.getItem('dodam-neis-school')||'null');if(saved&&saved.name==='도담중학교'&&saved.officeCode&&saved.schoolCode&&Date.now()-saved.savedAt<30*24*60*60*1000)school=saved}catch{}if(!school){const info=await fetchNeisXml('schoolInfo',{SCHUL_NM:'도담중학교'},apiKey);const matches=[...info.getElementsByTagName('row')].map(row=>({name:row.getElementsByTagName('SCHUL_NM')[0]?.textContent?.trim()||'',officeCode:row.getElementsByTagName('ATPT_OFCDC_SC_CODE')[0]?.textContent?.trim()||'',schoolCode:row.getElementsByTagName('SD_SCHUL_CODE')[0]?.textContent?.trim()||''})).filter(row=>row.name==='도담중학교'&&row.officeCode&&row.schoolCode);const sejong=matches.filter(row=>row.officeCode==='I10');school=sejong.length===1?sejong[0]:matches.length===1?matches[0]:null;if(!school)throw Error('도담중학교 기관을 하나로 확인할 수 없습니다');localStorage.setItem('dodam-neis-school',JSON.stringify({...school,savedAt:Date.now()}))}return school}
async function fetchMealsForDate(school,ymd,apiKey){const cacheKey='dodam-neis-meals-'+ymd;try{const cached=JSON.parse(localStorage.getItem(cacheKey)||'null');if(cached&&Date.now()-cached.savedAt<6*60*60*1000&&Array.isArray(cached.meals))return cached.meals}catch{}const data=await fetchNeisXml('mealServiceDietInfo',{ATPT_OFCDC_SC_CODE:school.officeCode,SD_SCHUL_CODE:school.schoolCode,MLSV_YMD:ymd},apiKey);const meals=[...data.getElementsByTagName('row')].map(row=>({type:row.getElementsByTagName('MMEAL_SC_NM')[0]?.textContent?.trim()||'',menu:row.getElementsByTagName('DDISH_NM')[0]?.textContent?.trim()||'',cal:row.getElementsByTagName('CAL_INFO')[0]?.textContent?.trim()||''})).filter(meal=>meal.type&&meal.menu).map(meal=>({...meal,menu:meal.menu.replace(/<br\s*\/?\s*>/gi,' · ').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim()}));localStorage.setItem(cacheKey,JSON.stringify({savedAt:Date.now(),meals}));return meals}
async function loadMeals(){todayMeals=[];nextMeals=[];const apiKey=window.DODAM_NEIS_API_KEY||'';if(!apiKey){heroViewRefresh();return}try{const school=await getSchoolInfo(apiKey);todayMeals=await fetchMealsForDate(school,dayKey(new Date()).replaceAll('-',''),apiKey);nextMeals=await fetchMealsForDate(school,nextMealYmd(),apiKey)}catch{todayMeals=[];nextMeals=[]}heroViewRefresh()}tick();loadSchedule();loadMeals();setInterval(tick,1000);setInterval(weather,15*60*1000);setInterval(loadSchedule,6*60*60*1000);setInterval(loadMeals,6*60*60*1000);
</script></body></html>
