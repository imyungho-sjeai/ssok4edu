<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSOK 에듀파인 업무도우미 다운로드</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 35px 20px;
        font-family: "Malgun Gothic", "맑은 고딕", Arial, sans-serif;
        background: #f5f7f9;
        color: #222;
    }

    .container {
        max-width: 1000px;
        margin: 0 auto;
        text-align: center;
    }

    h1 {
        margin: 0 0 24px;
        font-size: 34px;
        font-weight: 800;
    }

    .hero-image {
        display: block;
        width: auto;
        max-width: 100%;
        height: auto;
        margin: 0 auto 32px;
    }

    .download-button {
        display: inline-block;
        width: min(92%, 760px);
        padding: 24px 30px;
        border: 0;
        background-color: #2da44e;
        color: #fff;
        border-radius: 12px;
        font-family: inherit;
        font-size: 26px;
        font-weight: 800;
        line-height: 1.4;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(45,164,78,.25);
    }

    .download-button:hover {
        background-color: #278d43;
    }

    .download-button:disabled {
        background-color: #8a9a8e;
        cursor: wait;
    }

    #status {
        margin-top: 18px;
        min-height: 24px;
        font-size: 16px;
        color: #555;
    }

    .notice {
        margin: 22px auto 0;
        max-width: 760px;
        padding: 16px 20px;
        background: #fff;
        border-radius: 10px;
        line-height: 1.7;
        font-size: 15px;
        color: #555;
    }

    @media (max-width: 600px) {
        body { padding: 24px 12px; }
        h1 { font-size: 27px; }
        .download-button {
            width: 100%;
            padding: 20px 16px;
            font-size: 21px;
        }
    }
</style>
</head>

<body>
<div class="container">

    <h1>쏙(SSOK) for K-에듀파인</h1>

    <img
        class="hero-image"
        src="https://img.brojun.kr/81fad0ab-c5f1-4455-98b5-a0f8b41028f8/1788938966190-h2zsm0.png"
        alt="SSOK for K-에듀파인 안내 이미지">

    <button id="downloadBtn" class="download-button" type="button">
        쏙(SSOK) for K-에듀파인<br>
        교육행정 업무 도우미 다운로드
    </button>

    <div id="status"></div>

    <div class="notice">
        다운로드가 완료되면 <b>쏙웹실행하기.bat</b> 파일을 실행하세요.<br>
        브라우저 보안 정책상 웹페이지에서 BAT 파일을 자동 실행할 수는 없습니다.
    </div>

</div>

<script>
const RAW_URL =
    "https://imyungho-sjeai.github.io/ssok4edu/%EC%8F%99%EC%9B%B9%EC%8B%A4%ED%96%89%ED%95%98%EA%B8%B0.bat";

const FILE_NAME = "쏙웹실행하기.bat";

const button = document.getElementById("downloadBtn");
const status = document.getElementById("status");

button.addEventListener("click", async () => {
    button.disabled = true;
    status.textContent = "설치 파일을 준비하고 있습니다...";

    try {
        const response = await fetch(RAW_URL, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.arrayBuffer();

        if (!data || data.byteLength === 0) {
            throw new Error("다운로드한 파일이 비어 있습니다.");
        }

        const blob = new Blob(
            [data],
            { type: "application/octet-stream" }
        );

        const blobUrl = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = FILE_NAME;
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);

        status.textContent =
            "다운로드를 시작했습니다. 다운로드 폴더의 쏙웹실행하기.bat를 실행하세요.";
    }
    catch (err) {
        console.error(err);
        status.textContent =
            "다운로드에 실패했습니다. 잠시 후 다시 시도해 주세요.";
    }
    finally {
        button.disabled = false;
    }
});
</script>

</body>
</html>
